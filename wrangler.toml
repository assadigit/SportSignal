name = "ucl-notifier"
main = "src/worker.ts"
compatibility_date = "2025-11-04"
compatibility_flags = ["nodejs_compat"]

# v13.17-cards: WASM module for @resvg/resvg-wasm (SVG→PNG rendering in the
# Worker, so the bot can send match-card images inline via sendPhotoBinary).
# The wasm file is referenced by the resvg-wasm package's import.
rules = [
  { type = "CompiledWasm", globs = ["**/index_bg.wasm"], fallthrough = false }
]

# Static assets (bg.jpg etc.) served automatically before the worker runs
[assets]
directory = "./assets"
not_found_handling = "none"

# KV Namespace Binding
[[kv_namespaces]]
binding = "STATE"
id = "432ecae8fb8c4146b6b01b91eb8f4b2a"
preview_id = "8784e1973a984dea981010a6d644f153"

# v13.56-visitcount: dedicated D1 database for the cookieless page-view
# counter. Isolated from the STATE KV namespace's 1,000-writes/day free-tier
# quota (the chronic 13.55-epochflow pain point); D1's free tier allows
# 100k writes/day. SQLite also gives atomic `pageviews = pageviews + 1`
# upserts (KV has no atomic increment — read-modify-write loses updates under
# concurrency). See src/stats.ts. Optional binding: the worker still boots if
# absent (beacon/admin degrade to zeroes + a "not configured" flag).
[[d1_databases]]
binding = "STATS_DB"
database_name = "sportsignal-stats"
database_id = "dcbea85b-6e71-40a0-974b-4f58d12d15e7"

# v14.0.5-cupgap: TWO triggers — the 10-min tick (bot + pool) + the lean
# 4-hourly far-cup probe (see probeCupFarFixtures in providers.ts + the
# api.ts scheduled branch; minute 27 keeps it between the :20/:30 ticks).
[triggers]
crons = ["*/10 * * * *", "27 */4 * * *"]

[vars]
TEHRAN_TZ = "Asia/Tehran"

# v12.x-ai-translate: Workers AI binding for automatic Farsi club name translation.
# The worker's translateTeam function checks the AI-learned names (KV fa_teams_ai)
# before falling back to the English name. The AI runs on each /api/public-matches
# request via maybeRunFaAi to incrementally translate any new Latin names.
[ai]
binding = "AI"
# Secrets (BOT_TOKEN, CHAT_ID, API_TOKEN, ADMIN_TOKEN, ADMIN_PASS, WEBHOOK_SECRET)
# are set via `wrangler secret put` — never in vars.
# v13.48-xtrim: the X (Twitter) path is REMOVED — no X_* secrets exist.
# (X never ran: no secrets were ever set, x_enabled_v1 was never written.)
# Restore path: revert the 13.48-xtrim commit, then set the X_* secrets
# (X_API_KEY, X_API_SECRET, X_ACCESS_TOKEN, X_ACCESS_TOKEN_SECRET) via
# `wrangler secret put` and x_enabled_v1=1 in KV.