# SportSignal — Persian-alias PHASE-2 freeze-lift reminder (the "don't forget")
#
# WHY: the Persian-alias SEO phase 2 is blocked until the Dec 4-8 2026 GSC
# measurement freeze lifts (earliest Dec 9, 2026) AND the owner supplies the
# fresh Dec 4-8 GSC export. The owner asked (2026-11-19): "add something to
# github repo, to remind yourself, even if i forgot. like i say finish
# remaining work, you find it and do it on time."
#
# WHAT IT DOES: on Dec 9 + Dec 16, 2026 it PINGS the standing reminder issue
# (assadigit/SportSignal#4, opened 2026-11-19 with the full phase-2 prompt):
# a new comment (which notifies everyone watching the repo — the owner gets
# the email/web ping) + the issue is (re)opened + (re)labeled so it stays at
# the top of the tracker. The owner just re-fires an agent session and says
# "finish remaining work" — the issue + the HANDOFF banner + the
# next-session-prompt carry everything needed.
#
# Schedule (UTC, GitHub cron runs on the default branch = main):
#   10 8 9 12 *   → Dec 9, 2026 08:10 UTC (freeze-lift day; 11:40 Tehran)
#   10 8 16 12 *  → Dec 16, 2026 08:10 UTC (the backup nudge one week later)
#
# A year-guard skips scheduled runs outside Dec 2026 (cron recurs yearly —
# the guard prevents 2027+ noise; manual dispatch always runs).
#
# COMPLETION GUARD: phase 2 ships with the retirement of the reminder layer
# itself (DECISIONS PCA-2): the session deletes scripts/check-phase2-freeze-lift.js
# from the repo. If that file is gone from the default branch, phase 2 has
# shipped — this workflow no-ops (and the standing issue should be closed).
#
# This workflow is READ-ONLY against production: it does NOT deploy, does NOT
# change the worker, does NOT touch the GSC byte-freeze, and needs NO secret —
# the comment is created with the auto-provided GITHUB_TOKEN
# (permissions: issues: write).
name: phase2-freeze-lift-reminder

on:
  schedule:
    - cron: "10 8 9 12 *" # Dec 9 — the freeze lifts
    - cron: "10 8 16 12 *" # Dec 16 — the backup nudge
  workflow_dispatch: {}

permissions:
  issues: write
  contents: read

jobs:
  remind:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Year guard (skip stale yearly runs — cron recurs yearly)
        id: guard
        if: github.event_name == 'schedule'
        run: |
          YM=$(date -u +%Y%m)
          if [ "$YM" != "202612" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::scheduled run outside Dec 2026 (current $YM) — no-op (cron recurs yearly; guard prevents 2027+ noise)"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      # COMPLETION GUARD: the gate file's absence from the default branch is
      # the phase-2-shipped signal (PCA-2 retirement clause). Uses the GitHub
      # API contents endpoint — no checkout needed.
      - name: Completion guard (phase 2 already shipped? gate file retired?)
        id: done
        if: steps.guard.outputs.skip != 'true'
        uses: actions/github-script@v7
        with:
          script: |
            let shipped = false;
            try {
              await github.rest.repos.getContent({
                owner: context.repo.owner,
                repo: context.repo.repo,
                path: 'scripts/check-phase2-freeze-lift.js',
                ref: context.ref
              });
              // file still exists → phase 2 NOT shipped yet
            } catch (e) {
              if (e.status === 404) shipped = true; // retired → shipped
              else throw e;
            }
            core.setOutput('shipped', shipped ? 'true' : 'false');
            if (shipped) {
              core.notice('Phase 2 already shipped (the gate file was retired per PCA-2) — no reminder needed.');
            }

      # Find the standing reminder issue (opened 2026-11-19). If it was
      # closed without phase 2 shipping (misclick / stale bot), reopen it.
      - name: Locate the standing reminder issue
        id: find
        if: steps.guard.outputs.skip != 'true' && steps.done.outputs.shipped != 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const { data } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: 'phase-2-reminder',
              state: 'all',
              per_page: 5
            });
            const issue = data.find(i => i.title.includes('PERSIAN-ALIAS-PHASE-2'));
            if (!issue) {
              core.setFailed('No [PERSIAN-ALIAS-PHASE-2] reminder issue found — re-fire the PCA-2 session or create it from seo-implementation/next-session-prompt.md');
              return;
            }
            core.setOutput('number', issue.number);
            core.setOutput('state', issue.state);
            if (issue.state === 'closed') {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                state: 'open'
              });
              core.notice('Reopened issue #' + issue.number + ' (phase 2 has not shipped).');
            }

      - name: Ping the issue (comment = owner notification)
        if: steps.guard.outputs.skip != 'true' && steps.done.outputs.shipped != 'true' && steps.find.outputs.number
        uses: actions/github-script@v7
        with:
          script: |
            const nudge = `${{ github.event.schedule == '10 8 16 12 *' && '**Backup nudge (Dec 16):** still waiting — ' || '' }}The **Dec 4-8 2026 GSC measurement freeze has lifted** (today is past the earliest lift date, Dec 9). Phase 2 of the Persian-alias SEO work can start.

            **To the owner:** upload the fresh **Dec 4-8 GSC export** (Search Results export from Google Search Console, 16-month range if possible) into the next agent session and say *"finish remaining work"* — the agent will find this issue and the full work order in \`seo-implementation/next-session-prompt.md\`.

            **To the agent reading this:** before ANY visible-surface change, verify the three unblocks (see the issue body above + the HANDOFF banner): (1) the date is Dec 9, 2026 or later; (2) the owner's freeze-lift decision + final measurement record (read \`docs/HANDOFF.md\` + \`docs/DECISIONS.md\` — a date passing alone is NOT proof); (3) the uploaded Dec 4-8 GSC export. **If the export is absent: stop and report — never fabricate metrics.**

            _Scheduled ping from the \`phase2-freeze-lift-reminder\` workflow (run ${context.runId}). After phase 2 ships: close this issue, disable the workflow, retire the banner + the gate (PCA-2)._`;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: ${{ steps.find.outputs.number }},
              body: nudge
            });
